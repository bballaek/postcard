@import url('https://fonts.googleapis.com/css2?family=Cabin+Sketch&family=Great+Vibes&family=Rye&display=swap');

/* Postcard card — shared layout (826×572 design canvas) */

.postcard-card{
  position:relative;
  width:826px;
  height:572px;
  flex:0 0 auto;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

.postcard-card img{
  display:block;
  pointer-events:none;
}

/* Photo slot — 762×508 @ (32, 32) */

.pc-photo{
  position:absolute;
  left:32px;
  top:32px;
  width:762px;
  height:508px;
  border-radius:12px;
  overflow:hidden;
  z-index:3;
}

.pc-photo img,
.pc-photo canvas{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.pc-photo--empty{
  background:#d4d4d4;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pc-upload-cta{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  opacity:.4;
}

.pc-upload-cta img{width:44px;height:44px;}

.pc-upload-cta span{
  font-family:Inter,system-ui,sans-serif;
  font-weight:500;
  font-size:18px;
  line-height:18px;
  color:#000;
}

/* Generic gray placeholder slot */

.pc-slot-gray{
  background:#d4d4d4;
}

/* Frame overlay — border ring under content */

.pc-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}

/* Title hint — per line */

.pc-line-hint{opacity:.3;}

/* ===== Modern — Front ===== */

.postcard-card--modern.postcard-card--front .pc-front-title,
.postcard-card--modern.postcard-card--front .pc-front-title .pc-underline{
  font-family:'Cabin Sketch',cursive;
  font-weight:400;
}

.postcard-card--modern.postcard-card--front .pc-front-title{
  position:absolute;
  left:80px;
  top:360px;
  z-index:5;
  font-size:66px;
  line-height:66px;
  color:#000;
  white-space:normal;
}

.postcard-card--modern.postcard-card--front .pc-front-title .pc-underline{
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:4px;
}

/* Stamp slot — reserved, empty by default */

.postcard-card--modern .pc-stamp-slot--front{
  position:absolute;
  left:627px;
  top:62px;
  width:137px;
  height:140px;
  z-index:4;
}

.postcard-card--modern .pc-stamp-slot--front img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== Modern — Back ===== */

.postcard-card--modern.postcard-card--back{
  background:transparent;
}

.postcard-card--modern.postcard-card--back .pc-back-inner{
  position:absolute;
  left:32px;
  top:32px;
  width:762px;
  height:508px;
  border:1.4px dashed rgba(255,255,255,.2);
  z-index:3;
  --pc-rule-width:236px;
  --pc-message-rule-width:346px;
}

.postcard-card--modern .pc-back-divider{
  position:absolute;
  left:326px;
  top:73px;
  width:1.4px;
  height:362px;
  background:rgba(255,255,255,.35);
}

.postcard-card--modern .pc-back-title,
.postcard-card--modern .pc-back-title .pc-underline{
  font-family:'Cabin Sketch',cursive;
  font-weight:400;
}

.postcard-card--modern .pc-back-title{

  top:48px;
  font-size:36px;
  line-height:38px;
  color:#fff;
  white-space:nowrap;
}

.postcard-card--modern .pc-back-title .pc-underline{
  text-decoration:underline;
  text-underline-offset:3px;
}

.postcard-card--modern .pc-stickers{
  position:absolute;
  left:48px;
  top:216px;
  display:grid;
  grid-template-columns:96px 96px;
  grid-template-rows:96px 96px;

.postcard-card--modern .pc-sticker-slot{

.postcard-card--modern .pc-sticker-slot--empty{

.postcard-card--modern .pc-sticker-slot--empty .pc-slot-upload{

.postcard-card--modern .pc-sticker-slot img{

.postcard-card--modern .pc-message-lines{

.postcard-card--modern .pc-message-lines .pc-line{
  position:static;

  height:1.4px;

}

.postcard-card--modern .pc-message{
  position:absolute;
  left:386px;
  top:235px;
  width:var(--pc-message-rule-width, 346px);
  z-index:2;
  pointer-events:none;
}

.postcard-card--modern .pc-message-row{
  position:relative;
  height:40px;
  overflow:visible;
}

.postcard-card--modern .pc-message-text{
  position:absolute;
  left:0;
  top:0;
  display:block;
  font-family:'Playpen Sans Thai','Homemade Apple',cursive;
  font-size:20px;
  line-height:40px;
  height:40px;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:var(--pc-message-rule-width, 346px);
}

/* Title hint — back uses lighter ghost */

.postcard-card--modern.postcard-card--back .pc-line-hint{
  opacity:.2;
}

/* Postage stamp slot */

.postcard-card--modern .pc-postage-slot{
  position:absolute;
  left:652px;
  top:30px;
  width:64px;
  height:98px;
  z-index:4;
}

.postcard-card--modern .pc-postage-frame{

  inset:0;
  width:100%;
  height:100%;

.postcard-card--modern .pc-postage-art{

.postcard-card--modern .pc-postage-inner{

.postcard-card--modern .pc-postage-slot--empty{

.postcard-card--modern .pc-postage-slot--empty .pc-slot-upload{
  width:24px;
  height:24px;
  opacity:.4;
  pointer-events:none;
}

.postcard-card--modern .pc-sticker-slot,
.postcard-card--modern .pc-postage-slot--empty{
  pointer-events:auto;

.postcard-card--modern .pc-stamp-slot--back{
  position:absolute;
  left:518px;
  top:373px;
  width:83px;
  height:85px;
  z-index:5;
}

.postcard-card--modern .pc-stamp-slot--back img{
  width:100%;
  height:100%;
  object-fit:contain;

.postcard-card--retro70 .pc-stamp-slot--front img,

<style id="postcard-create">
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  min-height:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
}

/* Create postcard page — Figma 1440×1024 */
.create-page{
  --ink:#0c0c0c;
  --bg:#fff;
  --border:rgba(0,0,0,.1);
  --fill-0:var(--page-frame-fill, #e7dde0);
  min-height:100%;
  width:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.create-stage-wrap{
  position:relative;
  flex:0 0 auto;
  margin:0 auto;
}

.create-stage{
  position:relative;
  width:1440px;
  height:1024px;
  flex:0 0 auto;
  transform-origin:top left;
  margin:0 auto;
}

.create-bg-deco{
  position:absolute;
  left:608px;
  top:35px;
  width:797px;
  height:954px;
  pointer-events:none;
  z-index:0;
  background:var(--page-frame-fill, #e7dde0);
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
}

.create-divider-v{
  position:absolute;
  left:573px;
  top:0;
  width:1px;
  height:1024px;
  background:var(--border);
  z-index:1;
}

/* ===== Left panel ===== */
.create-panel{
  position:absolute;
  left:125px;
  top:0;
  width:408px;
  height:100%;
  z-index:2;
}

.create-topnav{
  position:absolute;
  left:125px;
  top:80px;
  display:flex;
  align-items:center;
  gap:32px;
  z-index:3;
}
.create-topnav a{
  display:block;
  width:32px;
  height:32px;
  flex-shrink:0;
}
.create-topnav a img{width:100%;height:100%;display:block;object-fit:contain;}
.create-side-tab{
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  font-family:'Instrument Serif',Georgia,serif;
  font-size:40px;
  line-height:40px;
  color:var(--ink);
  text-transform:lowercase;
}
.create-side-tab.is-active{
  font-style:italic;
  text-decoration:underline;
  text-underline-offset:4px;
}
.create-topnav-sep{
  width:1px;
  height:36px;
  background:var(--border);
  flex-shrink:0;
}

.create-field{
  position:absolute;
  left:0;
  width:408px;
}
.create-field--style{top:160px;}
.create-field--title{top:386px;}
.create-field--color{top:520px;width:373px;}
.create-field--stamp{top:630px;width:373px;}

/* Back panel fields */
.create-field--from{top:160px;}
.create-field--to{top:276px;}
.create-field--message{top:392px;}
.create-field--stickers{
  top:590px;
  width:auto;
  z-index:3;
  padding-bottom:24px;
}
.create-field--postmark-back{top:830px;width:153px;}
.create-field--postage-pick{top:830px;left:310px;width:auto;}

.create-textarea-wrap{
  display:flex;
  gap:16px;
  align-items:flex-start;
  min-height:120px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
}
.create-textarea-wrap img{width:24px;height:24px;flex-shrink:0;margin-top:2px;display:block;}
.create-textarea-wrap textarea{
  flex:1;
  border:none;
  outline:none;
  resize:none;
  min-height:88px;
  font-family:Inter,system-ui,sans-serif;
  font-size:18px;
  font-weight:500;
  color:var(--ink);
  background:transparent;
  line-height:1.4;
}
.create-textarea-wrap textarea::placeholder{color:rgba(0,0,0,.6);}

.create-picker-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  max-width:408px;
  margin-bottom:12px;
}
.create-picker-item{
  width:64px;
  height:64px;
  padding:4px;
  border:2px solid transparent;
  border-radius:4px;
  background:transparent;
  cursor:pointer;
  flex-shrink:0;
  transition:border-color .2s ease,opacity .2s ease;
}
.create-picker-item img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:2px;
  pointer-events:none;
}
.create-picker-item.is-active{border-color:var(--ink);}
.create-picker-item.is-dim{opacity:.5;}

.create-postage-pick{
  display:flex;
  gap:10px;
}
.create-postage-item{
  position:relative;
  width:46px;
  height:64px;
  padding:0;
  border:2px solid transparent;
  background:none;
  cursor:pointer;
  flex-shrink:0;
  opacity:.5;
  transition:border-color .2s ease,opacity .2s ease;
}
.create-postage-item.is-active{
  border-color:var(--ink);
  opacity:1;
}
.create-postage-frame{
  position:absolute;
  inset:0;
